<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            font-family: Georgia, 'Times New Roman', Times, serif;
            color: blue;
            font-weight: 500;
        }
        .momo{
            font-style: italic;  
            color: darksalmon;
            font-family: 'Courier New', Courier, monospace;
        }
        .cemong{
            font-style: oblique;
            color: rgb(112, 184, 150);
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
        }
    </style>
</head>
<body>
    <p style="font-weight: bold;color: maroon;">Ini adalah kalimat pertama.</p>
    <p>Ini adalah kalimat kedua.</p>
    <p class="momo">Ini adalah kalimat ketiga.</p>
    <p class="cemong">Ini adalah kalimat keempat.</p>

</body>
</html>
